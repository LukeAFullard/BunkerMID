<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BunkerMID v0.18 - Browser-Native Markdown Extraction</title>
  <script src="./coi-serviceworker.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      background: #f8f9fa;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drop-zone.disabled {
      cursor: not-allowed;
      opacity: 0.6;
      pointer-events: none;
    }
    .drop-zone:hover {
      background: #e9ecef;
      border-color: #adb5bd;
    }
    #output {
      width: 100%;
      height: 400px;
      margin-top: 1rem;
      font-family: monospace;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f8f9fa;
    }
    .loader {
      display: none;
      margin-top: 1rem;
      color: #666;
    }
  </style>
  <script type="module" crossorigin src="/BunkerMID/assets/index-WQw8WzdG.js"></script>
</head>
<body>
  <h1>BunkerMID v0.18</h1>
  <p>Convert DOCX, XLSX, PPTX, HTML, PDF, and TXT to Markdown natively in your browser.</p>

  <label class="drop-zone disabled" id="drop-zone" for="file-input" style="display: block;">
    <p id="drop-text">Downloading AI extraction engine (~10MB) (0%)...</p>
    <input type="file" id="file-input" style="position: absolute; opacity: 0; width: 0; height: 0;" accept=".docx,.xlsx,.csv,.pptx,.html,.htm,.txt,.pdf" disabled />
  </label>

  <div class="loader" id="loader-container">
    <div id="loader">Extracting data (10%)...</div>
    <progress id="progress-bar" value="0" max="100" style="width: 100%; margin-top: 0.5rem;"></progress>
  </div>

  <textarea id="output" readonly placeholder="Extracted markdown will appear here..."></textarea>

  <div style="margin-top: 1rem; text-align: right;">
    <button id="download-btn" disabled style="padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer;">Download Markdown</button>
  </div>
</body>
</html>

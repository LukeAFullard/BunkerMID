<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BunkerMID - Browser-Native Markdown Extraction</title>
  <script type="module" src="/src/main.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      background: #f8f9fa;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drop-zone:hover {
      background: #e9ecef;
      border-color: #adb5bd;
    }
    #output {
      width: 100%;
      height: 400px;
      margin-top: 1rem;
      font-family: monospace;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f8f9fa;
    }
    .loader {
      display: none;
      margin-top: 1rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>BunkerMID</h1>
  <p>Convert DOCX, XLSX, PPTX, HTML, and TXT to Markdown natively in your browser.</p>

  <div class="drop-zone" id="drop-zone">
    <p>Drag and drop a file here, or click to select</p>
    <input type="file" id="file-input" style="display: none" accept=".docx,.xlsx,.pptx,.html,.htm,.txt" />
  </div>

  <div class="loader" id="loader">Processing...</div>

  <textarea id="output" readonly placeholder="Extracted markdown will appear here..."></textarea>
</body>
</html>
